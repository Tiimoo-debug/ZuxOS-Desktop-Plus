name: Build module APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the version code is derived from the commit count, and a shallow
          # clone would pin every build to 1.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list still contains the obsolete "tools"
          # package, which no longer exists in the repository and fails the step.
          packages: ''

      - name: Install SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Report version and signer
        run: |
          ls -l app/build/outputs/apk/release/
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs \
            app/build/outputs/apk/release/app-release.apk | grep -i "SHA-256" || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: zuxos-desktop-plus-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

name: Build module APK

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the version code is derived from the commit count, and a shallow
          # clone would pin every build to 1.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default package list still contains the obsolete "tools"
          # package, which no longer exists in the repository and fails the step.
          packages: ''

      - name: Install SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # Before the APK, and on purpose: these need no Android at all and finish in seconds, so a
      # logic regression fails here rather than on a tablet.
      - name: Unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :logic:test

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logic-test-report
          path: logic/build/reports/tests/test
          if-no-files-found: ignore

      - name: Version
        # The same number the build gives itself: 1.0.<commit count>.
        run: echo "VERSION=1.0.$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew --no-daemon assembleRelease assembleDebug

      - name: Report version and signer
        run: |
          echo "Version $VERSION"
          ls -l app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          "$ANDROID_HOME"/build-tools/36.0.0/aapt2 dump badging "$APK" | head -n 1 || true
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$APK" \
            | grep -i "SHA-256" || true

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: zuxos-desktop-plus-${{ env.VERSION }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
